[project]
name = "stock-agent"
version = "0.1.0"
description = "KR/US stock analysis agent (LangGraph MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",
    "yfinance>=0.2.40",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.32",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[project.scripts]
stock-agent = "src.main:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
