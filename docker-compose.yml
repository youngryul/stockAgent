services:
  app:
    build: .
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head &&
             python -m src.main seed &&
             python -m src.main schedule"
    restart: unless-stopped

  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stockagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stockagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
